[project]
name = "aws95"
description = "AWS 95 Tools: a retro desktop explorer for multiple AWS accounts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.10,<6.11",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26",
    "boto3>=1.34",
]

[project.scripts]
aws95 = "aws95.app:main"

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "pytest>=8",
    "pytest-qt>=4.4",
]

[tool.hatch.version]
path = "aws95/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["aws95"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["."]
